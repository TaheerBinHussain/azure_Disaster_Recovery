name: 🚀 CI/CD — Build, Push & Deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  APP_NAME: week6-dr-app
  RESOURCE_GROUP: week6-dr-rg
  IMAGE: ghcr.io/${{ github.repository_owner }}/azure_disaster_recovery

jobs:
  # ════════════════════════════════════════════════════════════
  # JOB 1 — Build & Push Docker image to GitHub Container Registry
  # ════════════════════════════════════════════════════════════
  build:
    name: 🏗️ Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Login to GitHub Container Registry (FREE)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🐳 Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════
  # JOB 2 — Deploy to Azure Container Apps
  # ════════════════════════════════════════════════════════════
  deploy:
    name: 🌩️ Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🚀 Deploy new revision to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup:     ${{ env.RESOURCE_GROUP }}
          containerAppName:  ${{ env.APP_NAME }}
          imageToDeploy:     ${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }}

      - name: ⏳ Wait for container to start (30s)
        run: sleep 30

      - name: 🩺 Health Check — verify new revision is alive
        id: healthcheck
        run: |
          APP_URL=$(az containerapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          echo "APP_URL=https://$APP_URL" >> $GITHUB_ENV

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 --retry 5 --retry-delay 10 \
            https://$APP_URL/health)

          echo "Health check status: $HTTP_STATUS"
          echo "HTTP_STATUS=$HTTP_STATUS" >> $GITHUB_OUTPUT

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Health check FAILED (got $HTTP_STATUS)"
            exit 1
          fi
          echo "✅ Health check PASSED"

      # ── Auto Rollback on failure ──────────────────────────
      - name: 🔄 AUTO ROLLBACK — revert to previous revision
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          echo "🚨 Deployment failed — triggering automatic rollback..."

          # Get the second-latest revision (previous stable)
          PREV_REVISION=$(az containerapp revision list \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[1].name" -o tsv)

          echo "Rolling back to: $PREV_REVISION"

          az containerapp ingress traffic set \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision-weight "$PREV_REVISION=100"

          echo "✅ Rollback complete! Traffic restored to $PREV_REVISION"

      - name: 📊 Print deployment summary
        if: success()
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║        ✅  DEPLOYMENT SUCCESSFUL             ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  App URL : $APP_URL"
          echo "║  Image   : ${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }}"
          echo "║  Region  : eastus (Free Tier)"
          echo "╚══════════════════════════════════════════════╝"

  # ════════════════════════════════════════════════════════════
  # JOB 3 — Terraform: provision/update Azure infra
  # ════════════════════════════════════════════════════════════
  terraform:
    name: 🏗️ Terraform Apply
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: 🔧 Terraform Init
        working-directory: ./infra
        run: terraform init
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: 📋 Terraform Plan
        working-directory: ./infra
        run: terraform plan -out=tfplan
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: 🚀 Terraform Apply
        working-directory: ./infra
        run: terraform apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
